# Configuration for chloggen, the changelog fragment tool also used by the core semantic
# conventions. See CONTRIBUTING.md for how to add an entry and RELEASING.md for how entries
# are rendered into CHANGELOG.md.
# - 'make chlog-new' copies 'template_yaml' into 'entries_dir' as a new entry file.
# - 'make chlog-validate' validates every entry file.
# - 'make chlog-update' renders every entry file into CHANGELOG.md, then deletes them.

entries_dir: .chloggen
template_yaml: .chloggen/TEMPLATE.yaml

change_logs:
  user: CHANGELOG.md
default_change_logs: [user]

# Links each entry's issues to this repository.
summary_template: .chloggen/CHANGELOG.tmpl
